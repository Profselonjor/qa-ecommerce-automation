name: QA Automation Ecommerce

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Newman
        run: npm install -g newman

      - name: Run Test
        run: newman run api-testing/postman_collection.json -r cli,html --reporter-html-export newman-report.html

      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: ecommerce-report
          path: newman-report.html
